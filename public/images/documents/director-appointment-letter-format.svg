<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg2)" />

  <!-- Subtle grid overlay -->
  <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
  </pattern>
  <rect width="1200" height="630" fill="url(#grid2)" />

  <!-- Top Badge -->
  <g transform="translate(60, 45)">
    <rect width="320" height="32" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
    <text x="160" y="21" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">
      COMPANIES ACT, 2013 &bull; STATUTORY GUIDE
    </text>
  </g>

  <!-- Header Section -->
  <text x="60" y="118" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="800">
    Director Appointment Compliance Architecture in India
  </text>
  <text x="60" y="152" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="16" font-weight="500">
    Sections 149, 152, 161, 164, 166, 170 &amp; Schedule IV &bull; DIR-2 Consent &bull; 30-Day DIR-12 ROC Filing
  </text>

  <!-- Gold Divider -->
  <rect x="60" y="172" width="1080" height="3" fill="url(#gold2)" rx="1.5" />

  <!-- 3 Main Pillars / Fact Cards -->
  <!-- Card 1: Pre-requisites -->
  <g transform="translate(60, 195)">
    <rect width="340" height="375" rx="14" fill="url(#cardBg2)" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="340" height="6" fill="#10B981" rx="3" />
    <text x="24" y="38" fill="#10B981" font-family="system-ui, sans-serif" font-size="18" font-weight="700">
      1. Mandatory Pre-Conditions
    </text>

    <text x="24" y="68" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
      Active DIN (Director ID)
    </text>
    <text x="24" y="94" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Sections 153&ndash;159 Companies Act
    </text>
    <text x="24" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Appointment without DIN is VOID
    </text>

    <line x1="24" y1="140" x2="316" y2="140" stroke="#334155" stroke-width="1" />

    <text x="24" y="170" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
      Form DIR-2 Written Consent
    </text>
    <text x="24" y="196" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Section 152(5) mandatory consent
    </text>
    <text x="24" y="220" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Must be obtained prior to board meeting
    </text>

    <line x1="24" y1="242" x2="316" y2="242" stroke="#334155" stroke-width="1" />

    <text x="24" y="272" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
      Non-Disqualification &amp; MBP-1
    </text>
    <text x="24" y="298" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Section 164 disqualification declaration
    </text>
    <text x="24" y="322" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Form MBP-1 disclosure under Sec 184(1)
    </text>
    <text x="24" y="346" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Table disclosure at first board meeting
    </text>
  </g>

  <!-- Card 2: Letter & Roles -->
  <g transform="translate(430, 195)">
    <rect width="340" height="375" rx="14" fill="url(#cardBg2)" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="340" height="6" fill="#F59E0B" rx="3" />
    <text x="24" y="38" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="18" font-weight="700">
      2. Designation &amp; Appointment Letter
    </text>

    <text x="24" y="68" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
      Additional Director (Sec 161(1))
    </text>
    <text x="24" y="94" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Appointed by Board between AGMs
    </text>
    <text x="24" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Office holds only until next AGM
    </text>

    <line x1="24" y1="140" x2="316" y2="140" stroke="#334155" stroke-width="1" />

    <text x="24" y="170" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
      Independent Director (Schedule IV)
    </text>
    <text x="24" y="196" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Formal appointment letter MANDATORY
    </text>
    <text x="24" y="220" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Committees, fiduciary duties &amp; fees
    </text>
    <text x="24" y="244" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Sec 149(7) independence declaration
    </text>

    <line x1="24" y1="266" x2="316" y2="266" stroke="#334155" stroke-width="1" />

    <text x="24" y="296" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
      Letterhead &amp; No Stamp Duty
    </text>
    <text x="24" y="322" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Issued on company&apos;s formal letterhead
    </text>
    <text x="24" y="346" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; No stamp duty on appointment letter itself
    </text>
  </g>

  <!-- Card 3: Post-Appointment Filings -->
  <g transform="translate(800, 195)">
    <rect width="340" height="375" rx="14" fill="url(#cardBg2)" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="340" height="6" fill="#38BDF8" rx="3" />
    <text x="24" y="38" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="18" font-weight="700">
      3. ROC Post-Appointment Filings
    </text>

    <text x="24" y="68" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
      Form DIR-12 Filing
    </text>
    <text x="24" y="94" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Section 170(2) statutory timeline
    </text>
    <text x="24" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Within 30 days of appointment date
    </text>
    <text x="24" y="142" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Attach: Board Resolution, DIR-2, MBP-1
    </text>

    <line x1="24" y1="165" x2="316" y2="165" stroke="#334155" stroke-width="1" />

    <text x="24" y="195" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
      Register of Directors &amp; KMP
    </text>
    <text x="24" y="221" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Update statutory register (Sec 170(1))
    </text>
    <text x="24" y="245" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Maintained at Registered Office
    </text>

    <line x1="24" y1="268" x2="316" y2="268" stroke="#334155" stroke-width="1" />

    <text x="24" y="298" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
      Duties of Directors (Sec 166)
    </text>
    <text x="24" y="324" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Fiduciary care, good faith, no conflict
    </text>
    <text x="24" y="348" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
      &bull; Penal fine &#8377;1L to &#8377;5L for breach
    </text>
  </g>

  <!-- Footer Tag -->
  <text x="600" y="605" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">
    CorpLawUpdates.in &bull; Verified Indian Corporate Law Intelligence &bull; Word (.docx) &amp; PDF Generator
  </text>
</svg>
